
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Contato - Naga's Hotel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header>
    <div class="navbar">
        <div class="logo">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo Naga's Hotel" height="40">
            Naga's Hotel
        </div>

        <nav class="menu">
            <a href="{{ url_for('index') }}">Início</a>
            <a href="{{ url_for('sobre') }}">Sobre Nós</a>
            <a href="{{ url_for('contato') }}">Contato</a>
        </nav>

        <div class="auth-btns">
            {% if 'usuario_id' not in session %}
                <a href="/login">Login</a>
            {% else %}
                <a href="/logout" class="logout">Sair</a>
            {% endif %}
        </div>
    </div>
</header>

<main>
    <div class="welcome-box">
        <h2>Contato</h2>

        <form method="POST" action="{{ url_for('contato') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <label for="email">Seu e-mail:</label>
            <input type="email" id="email" name="email" required>

            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" rows="4" required></textarea>

            <button type="submit">Enviar</button>
        </form>
    </div>
</main>

</body>
</html>
